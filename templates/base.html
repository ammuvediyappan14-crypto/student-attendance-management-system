<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Attendance Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">Attendance System</a>
    {% if session.get('user') %}
    <div>
      <a class="btn btn-light btn-sm me-1" href="{{ url_for('dashboard') }}">Dashboard</a>
      <a class="btn btn-light btn-sm me-1" href="{{ url_for('students') }}">Students</a>
      <a class="btn btn-light btn-sm me-1" href="{{ url_for('attendance') }}">Attendance</a>
      <a class="btn btn-light btn-sm me-1" href="{{ url_for('reports') }}">Reports</a>
      <a class="btn btn-warning btn-sm" href="{{ url_for('logout') }}">Logout</a>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
